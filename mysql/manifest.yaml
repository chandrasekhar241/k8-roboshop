apiVersion: v1
kind: Secret
metadata:
  name: mysql-config
  namespace: roboshop
type: Opaque
data:
  MYSQL_ALLOW_EMPTY_PASSWORD: Um9ib1Nob3BAMQo=
---


apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: roboshop
  labels:
    project: roboshop
    tier: db
    component: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      tier: db
      component: mysql
  template:
    metadata:
      labels:
        project: roboshop
        tier: db
        component: mysql
    spec:
      containers:
      - name: mysql
        image: chandu4234/mysql:4.0.0
        
        envFrom:
        - secretRef:
            name: mysql-config
        # args: ["--mysql-native-password=ON"]
        # env:
        # - name: MYSQL_ROOT_PASSWORD
        #   value: "RoboShop@1"
          


---

apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: roboshop
  labels:
      project: roboshop
      tier: db
      component: mysql
spec:
  # service uses the below labels to select pods
  selector:
    project: roboshop
    tier: db
    component: mysql
  ports:
    - protocol: TCP
      port: 3306 #service port
      targetPort: 3306 #container port
